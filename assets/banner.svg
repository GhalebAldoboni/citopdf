<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#1c2230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ab4f8"/>
      <stop offset="1" stop-color="#c58af9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="page"><rect x="640" y="48" width="330" height="420" rx="6"/></clipPath>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="1080" cy="60" r="220" fill="#8ab4f8" opacity="0.06"/>
  <circle cx="120" cy="400" r="180" fill="#c58af9" opacity="0.05"/>

  <!-- title block -->
  <text x="72" y="150" font-size="56" font-weight="700" fill="#f1f3f4" letter-spacing="-1">Scholar PDF Viewer <tspan fill="url(#accent)">Lite</tspan></text>
  <text x="74" y="196" font-size="22" fill="#9aa0a6">A pdf.js port with in-text citations. Fast on any machine.</text>
  <rect x="74" y="222" width="120" height="4" rx="2" fill="url(#accent)"/>
  <g font-size="15" fill="#bdc1c6">
    <text x="74" y="270">▸  Click a citation, read the paper in place</text>
    <text x="74" y="300">▸  60 fps pinch zoom, one render per gesture</text>
    <text x="74" y="330">▸  Smooth on weak laptops and heavy scans alike</text>
    <text x="74" y="360">▸  Cite, Save to library, vector printing</text>
  </g>

  <!-- page mock -->
  <g filter="url(#shadow)">
    <rect x="640" y="48" width="330" height="420" rx="6" fill="#ffffff"/>
  </g>
  <g clip-path="url(#page)">
    <rect x="672" y="84" width="200" height="12" rx="2" fill="#202124"/>
    <rect x="672" y="106" width="140" height="7" rx="2" fill="#5f6368"/>
    <g fill="#dadce0">
      <rect x="672" y="140" width="266" height="7" rx="2"/>
      <rect x="672" y="156" width="250" height="7" rx="2"/>
      <rect x="672" y="172" width="180" height="7" rx="2"/>
      <rect x="878" y="172" width="60" height="7" rx="2"/>
      <rect x="672" y="188" width="266" height="7" rx="2"/>
      <rect x="672" y="204" width="230" height="7" rx="2"/>
      <rect x="672" y="236" width="266" height="7" rx="2"/>
      <rect x="672" y="252" width="200" height="7" rx="2"/>
      <rect x="672" y="268" width="266" height="7" rx="2"/>
      <rect x="672" y="284" width="150" height="7" rx="2"/>
      <rect x="672" y="316" width="266" height="7" rx="2"/>
      <rect x="672" y="332" width="240" height="7" rx="2"/>
      <rect x="672" y="348" width="266" height="7" rx="2"/>
      <rect x="672" y="364" width="120" height="7" rx="2"/>
      <rect x="672" y="396" width="266" height="7" rx="2"/>
      <rect x="672" y="412" width="220" height="7" rx="2"/>
    </g>
    <!-- citation link -->
    <rect x="856" y="170" width="28" height="11" rx="2" fill="#8ab4f8" opacity="0.35"/>
    <rect x="856" y="181" width="28" height="1.5" fill="#1a73e8"/>
    <text x="859" y="180" font-size="9" font-weight="600" fill="#1a73e8">[12]</text>
  </g>

  <!-- popup -->
  <g filter="url(#shadow)">
    <rect x="760" y="206" width="380" height="164" rx="10" fill="#303030"/>
  </g>
  <rect x="760" y="206" width="380" height="164" rx="10" fill="#303030"/>
  <path d="M866 206 l8 -10 l8 10 z" fill="#303030"/>
  <text x="782" y="240" font-size="15" font-weight="600" fill="#f5f5f5">Attention is all you need</text>
  <text x="782" y="262" font-size="12" fill="#ddd">A Vaswani, N Shazeer, N Parmar · NeurIPS, 2017</text>
  <g fill="#9aa0a6" font-size="11">
    <text x="782" y="286">The dominant sequence transduction models are based on</text>
    <text x="782" y="302">complex recurrent or convolutional neural networks…</text>
  </g>
  <g font-size="12" font-weight="600" fill="#e8eaed">
    <text x="782" y="342">★ Save</text>
    <text x="846" y="342">❞ Cite</text>
    <text x="906" y="342">Cited by 172k</text>
    <text x="1008" y="342">Related</text>
    <text x="1072" y="342">Versions</text>
  </g>
  <rect x="782" y="352" width="336" height="1" fill="#444"/>
</svg>
